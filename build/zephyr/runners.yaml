# Available runners configured by board.cmake.
runners:
- openocd
- jlink

# Default flash runner if --runner is not given.
flash-runner: openocd

# Default debug runner if --runner is not given.
debug-runner: openocd

# Common runner configuration values.
config:
  board_dir: /home/sudha/zephyer_rtos/zephyr/boards/others/stm32_min_dev
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /nix/store/2rgfn3mq975wy8yrvj571y641laqwk01-zephyr-sdk-0.17.4/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py
  openocd: /nix/store/gansjxb33f54p0zwr9vcjy7pfnvs9hii-zephyr-sdk-hosttools-0.17.4/bin/openocd
  openocd_search:
    - /nix/store/2rgfn3mq975wy8yrvj571y641laqwk01-zephyr-sdk-0.17.4/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  openocd:
    - --cmd-load
    - flash write_image erase
    - --cmd-verify
    - verify_image
  jlink:
    - --dt-flash=y
    - --device=STM32F103C8
    - --speed=4000
